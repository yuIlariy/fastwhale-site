<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

  <title>Contact | FastWhale 🐋</title>
  <meta name="description" content="Have a project in mind, need bot architecture, or want to discuss server setups? Let's chat." />
  <meta property="og:title" content="Contact | FastWhale 🐋" />
  <meta property="og:description" content="Have a project in mind, need bot architecture, or want to discuss server setups? Let's chat." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/contact.html" />
  <meta property="og:image" content="/banner.jpg" />
  <link rel="canonical" href="/contact.html" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css" />

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('fw-theme'); } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.classList.add(t);
    })();
  </script>
  <script src="site.config.js"></script>
</head>
<body data-page="contact">

  <main>
    <div class="section">
      <h2><i class="fas fa-paper-plane"></i> Contact &amp; Collab</h2>
      <p class="subheading">Have a project in mind, need bot architecture, or want to discuss server setups? Let's chat.</p>

      <div class="button-row">
        <a data-site-link="telegram" target="_blank" class="button contact" aria-label="Message on Telegram">
          <i class="fab fa-telegram-plane"></i>Telegram Me
        </a>
      </div>

      <p style="margin-top: 1.2rem; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem;">Email me directly:</p>
      <div>
        <span class="email-link" data-copy="email" data-copy-msg="Email copied!" tabindex="0" aria-label="Copy Email Address">
          <i class="far fa-envelope" style="margin-right: 4px; opacity: 0.8;"></i> <span data-site="email"></span>
        </span>
      </div>

      <p style="margin-top: 1.2rem; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem;">Prefer meta chaos? Hit me on WhatsApp:</p>
      <a data-site-link="whatsapp" target="_blank" class="button whatsapp" aria-label="Message on WhatsApp">
        <i class="fab fa-whatsapp"></i>WhatsApp Me
      </a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
