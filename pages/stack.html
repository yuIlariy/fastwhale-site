  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('fw-theme'); } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.classList.add(t);
    })();
  </script>
  <script src="../site.config.js"></script>

<body data-page="stack">

  <main>
    <div class="section">
      <h2><i class="fas fa-network-wired"></i> Tech Stack &amp; Infrastructure</h2>

      <div class="tech-grid">
        <div class="tech-card">
          <i class="fab fa-python"></i>
          <div>
            <div class="tech-text-main">Backend</div>
            <div class="tech-text-sub">Python, Pyrogram</div>
          </div>
        </div>
        <div class="tech-card">
          <i class="fas fa-database"></i>

          </div>
        </div>
        <div class="tech-card">
          <i class="fas fa-server"></i>

            <div class="tech-text-main">Hosting</div>
            <div class="tech-text-sub">Render, systemd Linux</div>

        </div>
        <div class="tech-card">

          </div>
        </div>
        <div class="tech-card">
          <i class="fas fa-terminal"></i>
          <div>
            <div class="tech-text-main">Automation</div>
            <div class="tech-text-sub">Telethon, worker queues</div>
          </div>
