eta chaos? Hit me on WhatsApp:</p>
    <a href="https://wa.me/254708583813?text=Hey%20Nam!%20Just%20landed%20on%20fastwhale.app%20and%20had%20to%20say%20%E2%80%94%20slick%20setup.%20Got%20a%20minute%3F" target="_blank" class="button whatsapp" aria-label="Message on WhatsApp">
      <i class="fab fa-whatsapp"></i>WhatsApp Me
    </a>
  </div>

<footer>
  <div class="footer-whale"><i class="fas fa-terminal"></i></div><br>
  <strong>fastwhale.app</strong> &mdash; <span id="year"></span>
  <div class="footer-quote" id="footerQuote"></div>
</footer>

<div id="terminal-modal" role="dialog" aria-modal="true" aria-label="Terminal Modal">
  <div class="terminal-window">
    <div class="terminal-header">
      <span>nam@fastwhale: ~</span>
      <span class="term-close" onclick="closeTerminal()" aria-label="Close Terminal">&times;</span>
    </div>
    <div class="terminal-body" id="term-body">
      <div>Welcome to FastWhale Server OS v1.0.</div>
      <div>Type 'help' for a list of available commands.</div>
      <div id="term-output"></div>
      <div class="terminal-input-line">
        <span class="term-prompt">nam@whale:~$</span>
        <input type="text" id="term-input" autocomplete="off" spellcheck="false" autofocus aria-label="Terminal Input">
      </div>
    </div>
  </div>
</div>

<div id="toast" role="alert" aria-live="assertive"><i class="fas fa-check-circle" style="color: var(--accent-green); margin-right: 6px;"></i> <span id="toast-msg">Copied!</span></div>

<button id="backToTop" aria-label="Back to top"><i class="fas fa-chevron-up"></i></button>

<script defer src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" onload="initParticles()"></script>

<script>
  // Setup Theme Button Before Rendering Logic
  const toggleBtn = document.getElementById('themeToggle');
  toggleBtn.innerHTML = document.documentElement.classList.contains('dark') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';

  // Boot Screen Logic
  document.addEventListener("DOMContentLoaded", () => {
    const bootContainer = document.getElementById('boot-text-container');
    const bootScreen = document.getElementById('boot-screen');
    const lines = [
      "[ OK ] Booting FastWhale OS kernel...",
      "[ OK ] Mounting MongoDB distributed clusters...",
      "[ OK ] Initializing Pyrogram async workers...",
      "[ OK ] Verifying systemd bot services...",
      "[ OK ] Establishing secure connection...",
      "> Access Granted. Welcome, Nam."
    ];
    
    let delay = 100;
    lines.forEach((line, index) => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'boot-line';
        div.textContent = line;
        bootContainer.appendChild(div);
        
        if(index === lines.length - 1) {
          setTimeout(() => {
            bootScreen.style.opacity = '0';
            setTimeout(() => { bootScreen.style.visibility = 'hidden'; }, 400);
          }, 600);
        }
      }, delay);
      delay += Math.floor(Math.random() * 150) + 100; 
    });
  });

  // Initialize Particles Background (called once script has loaded)
  function initParticles() {
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 35, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#8b5cf6" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.4, "random": false },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#8b5cf6", "opacity": 0.2, "width": 1 },
        "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "out_mode": "out" }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
        "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } } }
      },
      "retina_detect": true
    });
  }

  // Theme Toggle Logic
  function toggleTheme() {
    const root = document.documentElement;
    if (root.classList.contains('dark')) {
      root.classList.remove('dark');
      root.classList.add('light');
    } else {
      root.classList.remove('light');
      root.classList.add('dark');
    }
    toggleBtn.innerHTML = root.classList.contains('dark') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }

  // Tabs Logic
  function openTab(evt, tabName) {
    let tabcontent = document.getElementsByClassName("tab-content");
    for (let i = 0; i < tabcontent.length; i++) {
      tabcontent[i].classList.remove("active");
      tabcontent[i].setAttribute('aria-selected', 'false');
    }
    
    let tablinks = document.getElementsByClassName("tab-btn");
    for (let i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
    
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
    evt.currentTarget.setAttribute('aria-selected', 'true');
  }

  // Universal Copy Text Logic
  function copyText(textToCopy, successMsg) {
    navigator.clipboard.writeText(textToCopy).then(() => {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").innerText = successMsg;
      toast.className = "show";
      setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2500);
    }).catch(err => console.error('Failed to copy: ', err));
  }
  
  // Allow keyboard execution for copy commands
  document.querySelectorAll('.crypto-box, .email-link').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        el.click();
      }
    })
  });

  // Set Year & Quotes
  document.getElementById('year').textContent = new Date().getFullYear();
  const quotes = [
    "FastWhale: Where bots don't sleep and DNS never fails.",
    "Built fast. Runs faster. Breaks never.",
    "Precision is my love language.",
    "If it's patched, it's probably Nam.",
    "Minimal by design, maximal by impact."
  ];
  document.getElementById('footerQuote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

  // Back to Top
  const backToTopBtn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) backToTopBtn.classList.add('show');
    else backToTopBtn.classList.remove('show');
  });
  backToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // Terminal Logic
  const termModal = document.getElementById('terminal-modal');
  const termInput = document.getElementById('term-input');
  const termOutput = document.getElementById('term-output');
  const termBody = document.getElementById('term-body');

  function openTerminal() {
    termModal.style.display = 'flex';
    termInput.focus();
  }

  function closeTerminal() {
    termModal.style.display = 'none';
  }

  termInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const command = termInput.value.trim().toLowerCase();
      let response = '';
      
      switch(command) {
        case 'help': response = 'Available cmds: whoami, ping, stack, date, repo, clear, exit, root'; break;
        case 'whoami': response = 'Nam. Ads manager, builder, optimizer, bot architect.'; break;
        case 'ping': response = 'Pong! All nodes responding at 2ms. Status: GREEN.'; break;
        case 'stack': response = 'Python, Pyrogram, MongoDB, Redis, systemd, MikroTik RouterOS'; break;
        case 'date': response = new Date().toString(); break;
        case 'repo': response = 'Fetching source from GitHub... [Access Denied] Check out https://github.com/yuIlariy instead.'; break;
        case 'sudo': response = 'User "nam" is not in the sudoers file. This incident will be reported.'; break;
        case 'root': response = 'Access denied. Nice try though.'; break;
        case 'clear': termOutput.innerHTML = ''; termInput.value = ''; return;
        case 'exit': closeTerminal(); termInput.value = ''; return;
        case '': break;
        default: response = `bash: ${command}: command not found`;
      }

      if (command !== '') {
        termOutput.innerHTML += `<div><span class="term-prompt">nam@whale:~$</span> ${command}</div>`;
        if(response) termOutput.innerHTML += `<div style="color: #8b949e; margin-bottom: 5px;">${response}</div>`;
      }
      
      termInput.value = '';
      termBody.scrollTop = termBody.scrollHeight;
    }
  });

  // Close modal on outside click
  window.onclick = function(event) {
    if (event.target == termModal) closeTerminal();
  }
</script>
</body>
</html>
